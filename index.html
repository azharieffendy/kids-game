<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Kids Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="shared/design-tokens.css">
<link rel="stylesheet" href="shared/design-base.css">
<link rel="stylesheet" href="shared/design-components.css">
<style>
@keyframes float  {0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-10px) rotate(3deg);}}
@keyframes float2 {0%,100%{transform:translateY(0) rotate(4deg);}50%{transform:translateY(-8px) rotate(-2deg);}}
@keyframes float3 {0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-12px) rotate(5deg);}}
@keyframes pop-in {0%{transform:scale(0.5);opacity:0;}70%{transform:scale(1.06);}100%{transform:scale(1);opacity:1;}}
@keyframes slide-up{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}

body{
  font-family:var(--font-body);
  background:var(--bg-page);
  min-height:100vh;
}

.screen{
  width:min(100%, 1120px);
  margin:0 auto;
  background:linear-gradient(180deg, var(--bg-page) 0%, var(--bg-page-alt) 100%);
  position:relative;
  display:grid;
  gap:clamp(24px, 4vw, 40px);
  align-items:start;
  padding:clamp(28px, 5vw, 64px) clamp(20px, 4vw, 40px) clamp(36px, 5vw, 56px);
}

.blob{
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  opacity:0.18;
}

.hub-header{
  text-align:center;
  width:min(100%, 40rem);
  margin:0 auto;
  animation:pop-in 0.6s ease-out;
}

.hub-header__icon{
  font-size:56px;
  margin-bottom:8px;
  display:block;
  animation:float 3s ease-in-out infinite;
}

.hub-header__title{
  font-family:var(--font-display);
  font-size:40px;
  color:var(--ink-strong);
  line-height:1;
  text-shadow:0 3px 0 rgba(0,0,0,0.08);
}

.hub-header__sub{
  font-family:var(--font-body);
  font-weight:700;
  font-size:15px;
  color:var(--ink-soft);
  margin-top:8px;
  letter-spacing:0.5px;
}

.card-list{
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:var(--space-4);
  width:100%;
}

.game-card{
  width:100%;
  background:var(--bg-surface);
  border-radius:var(--radius-card);
  padding:22px 20px 20px;
  display:flex;
  align-items:center;
  gap:18px;
  cursor:pointer;
  box-shadow:0 6px 0 var(--card-shadow, rgba(0,0,0,0.15)), var(--shadow-card);
  transition:transform var(--motion-base) cubic-bezier(.34,1.56,.64,1), box-shadow var(--motion-base);
  border:3px solid var(--card-color);
  text-decoration:none;
  color:inherit;
  min-height:100%;
}

.game-card:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:0 10px 0 var(--card-shadow, rgba(0,0,0,0.15)), var(--shadow-card-strong);
}

.game-card:active{
  transform:translateY(3px) scale(0.98);
  box-shadow:0 3px 0 var(--card-shadow, rgba(0,0,0,0.15)), 0 4px 12px rgba(0,0,0,0.1);
}

.card-icon{
  width:64px;
  height:64px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  flex-shrink:0;
  background:var(--card-icon-bg);
}

.card-body{flex:1;}

.card-title{
  font-family:var(--font-display);
  font-size:20px;
  line-height:1.1;
  color:var(--ink-strong);
}

.card-desc{
  font-family:var(--font-body);
  font-weight:700;
  font-size:13px;
  color:var(--ink-soft);
  margin-top:3px;
}

.card-badge{
  display:inline-block;
  background:var(--card-color);
  color:var(--ink-inverse);
  font-family:var(--font-display);
  font-size:12px;
  padding:2px 10px;
  border-radius:var(--radius-pill);
  margin-top:6px;
}

.card-arrow{
  font-size:22px;
  color:var(--card-color);
  font-weight:900;
}

.hub-footer{
  font-family:var(--font-display);
  font-size:14px;
  color:rgba(26,26,46,0.3);
  margin:0;
  letter-spacing:0.5px;
  justify-self:center;
}

@media (max-width: 980px){
  .card-list{
    grid-template-columns:repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 640px){
  .screen{
    min-height:100vh;
    gap:24px;
    padding:24px 16px 32px;
  }

  .hub-header__title{
    font-size:34px;
  }

  .card-list{
    grid-template-columns:1fr;
  }

  .game-card{
    padding:18px 18px 16px;
    gap:14px;
  }

  .card-icon{
    width:56px;
    height:56px;
    font-size:28px;
  }
}
</style>
</head>
<body>
<div class="screen">
  <div class="blob" style="width:220px;height:220px;background:var(--accent-math);top:-80px;right:-60px;"></div>
  <div class="blob" style="width:160px;height:160px;background:var(--accent-reading);bottom:-40px;left:-50px;"></div>
  <div class="blob" style="width:80px;height:80px;background:var(--accent-warning);top:30%;left:-30px;"></div>

  <div class="hub-header">
    <span class="hub-header__icon">🎮</span>
    <h1 class="hub-header__title">Kids Games</h1>
    <p class="hub-header__sub">Pilih permainan seru! ✨</p>
  </div>

  <div class="card-list">
    <a href="math-game/index.html" class="game-card"
       style="--card-color:var(--accent-math);--card-shadow:#c94a4a;--card-icon-bg:#FFF0EE;animation:slide-up 0.45s ease-out 0.1s both;">
      <div class="card-icon">
        <span style="animation:float 2.8s ease-in-out infinite;">🔢</span>
      </div>
      <div class="card-body">
        <div class="card-title">Math Games</div>
        <div class="card-desc">Belajar matematika dengan seru!</div>
        <span class="card-badge">Populer 🔥</span>
      </div>
      <div class="card-arrow">›</div>
    </a>

    <a href="susun-kata/index.html" class="game-card"
       style="--card-color:var(--accent-reading);--card-shadow:#2e9e96;--card-icon-bg:#EEFAF9;animation:slide-up 0.45s ease-out 0.2s both;">
      <div class="card-icon">
        <span style="animation:float2 3.1s ease-in-out infinite;">📚</span>
      </div>
      <div class="card-body">
        <div class="card-title">Belajar Membaca</div>
        <div class="card-desc">Susun kata untuk belajar membaca!</div>
      </div>
      <div class="card-arrow">›</div>
    </a>

    <a href="memory-game/index.html" class="game-card"
       style="--card-color:var(--accent-memory);--card-shadow:#7c5fd4;--card-icon-bg:#F4F0FF;animation:slide-up 0.45s ease-out 0.3s both;">
      <div class="card-icon">
        <span style="animation:float3 2.5s ease-in-out infinite;">🎴</span>
      </div>
      <div class="card-body">
        <div class="card-title">Permainan Memori</div>
        <div class="card-desc">Temukan pasangan kartu yang sama!</div>
      </div>
      <div class="card-arrow">›</div>
    </a>
  </div>

  <p class="hub-footer">🌈 Selamat Belajar & Bermain!</p>
</div>
</body>
</html>
